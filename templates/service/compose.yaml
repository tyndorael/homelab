# Service template — copy this folder to hosts/<host>/<stack> and replace every `myapp`.
# Checklist: pinned tag · ./data bind mount · healthcheck · log rotation · secrets only in .env
name: myapp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  myapp:
    image: ghcr.io/example/myapp:1.0.0   # pin an exact version, never :latest
    container_name: myapp
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Required secret: compose refuses to start if it is missing.
      MYAPP_SECRET: ${MYAPP_SECRET:?set MYAPP_SECRET in .env}
    ports:
      - "${MYAPP_PORT:-8080}:8080"
    volumes:
      - ./data:/data      # all state next to this file (gitignored)
    # Uncomment on the Pi to put the app behind Nginx Proxy Manager by container name:
    # networks:
    #   - proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Optional resource caps (useful on the Pi):
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    logging: *logging

# networks:
#   proxy:
#     external: true
