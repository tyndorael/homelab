services:
  db:
    image: postgres:16-alpine
    container_name: ghostfolio_db
    environment:
      - POSTGRES_DB=${GHOSTFOLIO_DB_NAME:-ghostfolio}
      - POSTGRES_USER=${GHOSTFOLIO_DB_USER:-ghostfolio}
      - POSTGRES_PASSWORD=${GHOSTFOLIO_DB_PASSWORD:-change-me}
    volumes:
      - /mnt/vm_shares/nami/apps/ghostfolio/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ghostfolio

  redis:
    image: redis:7-alpine
    container_name: ghostfolio_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks:
      - ghostfolio

  ghostfolio:
    image: ghcr.io/ghostfolio/ghostfolio:latest
    container_name: ghostfolio
    user: "1000:1000"
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=production
      - PORT=3333
      - GHOSTFOLIO_URL=${GHOSTFOLIO_URL:-http://localhost:3333}
      - DATABASE_URL=postgresql://${GHOSTFOLIO_DB_USER:-ghostfolio}:${GHOSTFOLIO_DB_PASSWORD:-change-me}@db:5432/${GHOSTFOLIO_DB_NAME:-ghostfolio}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${GHOSTFOLIO_JWT_SECRET:-change-me}
      - JWT_EXPIRES_IN=${GHOSTFOLIO_JWT_EXPIRES_IN:-12h}
    ports:
      - "3333:3333"
    restart: unless-stopped
    networks:
      - ghostfolio
      - nginx-proxy-manager
    labels:
      - "dockpeek.tags=finance,ghostfolio"

networks:
  ghostfolio:
    name: ghostfolio
    driver: bridge
  nginx-proxy-manager:
    name: nginx-proxy-manager
    external: true
