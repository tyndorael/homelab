---
- name: Install qemu-guest-agent on nami
  hosts: nami
  become: true
  gather_facts: true

  tasks:
    - name: Ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: true
      register: apt_update
      until: apt_update is succeeded
      retries: 3
      delay: 5

    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Enable and start qemu-guest-agent service
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true
