---
- name: Mount NFS share on guests
  hosts: proxmox_guests
  become: true
  gather_facts: true

  vars:
    # Override via extra vars if needed: -e "nfs_server_ip=1.2.3.4 nfs_export_path=/export/path"
    nfs_server_ip: "192.168.50.107"
    nfs_export_path: "/mnt/HDD/Infra_storage/vm_shares"
    nfs_mount_point: "/mnt/vm_shares"
    nfs_mount_opts: "rw,_netdev"

  tasks:
    - name: Ensure nfs-common is installed
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true

    - name: Create mount point
      ansible.builtin.file:
        path: "{{ nfs_mount_point }}"
        state: directory
        mode: '0755'

    - name: Mount NFS share and persist in fstab
      ansible.builtin.mount:
        path: "{{ nfs_mount_point }}"
        src: "{{ nfs_server_ip }}:{{ nfs_export_path }}"
        fstype: nfs
        opts: "{{ nfs_mount_opts }}"
        state: mounted
