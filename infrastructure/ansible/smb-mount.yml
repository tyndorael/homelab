---
- name: Mount SMB share on guests
  hosts: proxmox_guests:ai_servers
  become: true
  vars:
    smb_credentials_file: "/root/.smb_credentials"
    smb_password: ""
    smb_file_mode: "0755"
    smb_dir_mode: "0755"
    smb_opts_extra: "_netdev"
    smb_uid: "{{ ansible_facts.user_uid | default(1000) }}"
    smb_gid: "{{ ansible_facts.user_gid | default(1000) }}"
    smb_shares:
      - name: media
        src: "//192.168.50.107/Media"
        mount: "/mnt/media"
      - name: ai
        src: "//192.168.50.107/AI"
        mount: "/mnt/ai"

  tasks:
    - name: Resolve UID for ansible user
      ansible.builtin.command: "id -u {{ ansible_user }}"
      register: smb_uid_cmd
      changed_when: false

    - name: Resolve GID for ansible user
      ansible.builtin.command: "id -g {{ ansible_user }}"
      register: smb_gid_cmd
      changed_when: false

    - name: Set resolved smb uid/gid
      ansible.builtin.set_fact:
        smb_uid: "{{ smb_uid_cmd.stdout | default('1000') }}"
        smb_gid: "{{ smb_gid_cmd.stdout | default('1000') }}"

    - name: Install cifs utilities
      ansible.builtin.apt:
        name: cifs-utils
        state: present
        update_cache: true

    - name: Write SMB credentials file (if provided)
      ansible.builtin.copy:
        dest: "{{ smb_credentials_file }}"
        mode: '0600'
        owner: root
        group: root
        content: |
          username={{ smb_username }}
          password={{ smb_password }}
      when: smb_username | length > 0 and smb_password | length > 0

    - name: Ensure mount points exist (owned by ansible user)
      ansible.builtin.file:
        path: "{{ item.mount }}"
        state: directory
        owner: "{{ ansible_user | default('root') }}"
        group: "{{ ansible_user | default('root') }}"
        mode: '0755'
      loop: "{{ smb_shares }}"

    - name: Mount SMB shares and persist in fstab
      ansible.builtin.mount:
        path: "{{ item.mount }}"
        src: "{{ item.src }}"
        fstype: cifs
        opts: "credentials={{ smb_credentials_file }},uid={{ smb_uid | int }},gid={{ smb_gid | int }},file_mode={{ smb_file_mode }},dir_mode={{ smb_dir_mode }},{{ smb_opts_extra }}"
        state: mounted
      loop: "{{ smb_shares }}"

    - name: Ensure mount ownership after mount
      ansible.builtin.file:
        path: "{{ item.mount }}"
        state: directory
        owner: "{{ ansible_user | default('root') }}"
        group: "{{ ansible_user | default('root') }}"
        mode: "{{ smb_dir_mode }}"
      loop: "{{ smb_shares }}"
