---
- name: Base tools for AI Server
  hosts: ai-server
  become: true
  gather_facts: true

  vars:
    base_packages:
      - build-essential
      - git
      - curl
      - wget
      - unzip
      - tmux
      - htop
      - nvtop
      - jq
      - python3
      - python3-pip
      - python3-venv
      - python-is-python3
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
    nvidia_driver_package: ubuntu-drivers-common
    miniconda_version: "py310_24.9.2-0"
    miniconda_root: "/opt/miniconda3"
    miniconda_owner: "{{ ansible_user | default('ubuntu') }}"
    miniconda_arch: "{{ ansible_facts['architecture'] | default('x86_64') }}"
    miniconda_installer: "Miniconda3-{{ miniconda_version }}-Linux-{{ miniconda_arch }}.sh"
    miniconda_url: "https://repo.anaconda.com/miniconda/{{ miniconda_installer }}"
    ai_root: "/home/ai"
    ai_owner: "{{ ansible_user | default('ubuntu') }}"
    ai_dirs:
      - comfyui
      - models/sd
      - models/lora
      - models/llm
      - docker
      - agents
    orcaslicer_config_dir: "/home/ai/orcaslicer/config"
    comfyui_repo: "https://github.com/comfyanonymous/ComfyUI.git"
    comfyui_dir: "{{ ai_root }}/comfyui"
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_user: "{{ ansible_user | default('ubuntu') }}"
    portainer_image: "portainer/portainer-ce:latest"
    portainer_container_name: "portainer"
    portainer_data_dir: "/opt/portainer/data"
    portainer_agent_image: "portainer/agent:latest"
    portainer_agent_container_name: "portainer_agent"
    comfyui_plugins:
      - name: "ComfyUI-Manager"
        repo: "https://github.com/Comfy-Org/ComfyUI-Manager.git"
        dest_subdir: "custom_nodes/ComfyUI-Manager"
    conda_env_name: "ai"
    conda_env_python: "3.10"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      register: apt_update
      until: apt_update is succeeded
      retries: 3
      delay: 5

    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64] https://download.docker.com/linux/ubuntu
          {{ ansible_facts['lsb']['codename'] }} stable
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Add user to docker group for non-root usage
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      when: docker_user | length > 0

    - name: Install NVIDIA driver helper
      ansible.builtin.apt:
        name: "{{ nvidia_driver_package }}"
        state: present

    - name: Check existing NVIDIA driver
      ansible.builtin.command: nvidia-smi -L
      register: nvidia_check
      failed_when: false
      changed_when: false

    - name: Run ubuntu-drivers autoinstall (only if missing)
      ansible.builtin.command: ubuntu-drivers autoinstall
      register: drivers_install
      changed_when: drivers_install.rc == 0
      when: nvidia_check.rc != 0

    - name: Download Miniconda installer
      ansible.builtin.get_url:
        url: "{{ miniconda_url }}"
        dest: "/tmp/{{ miniconda_installer }}"
        mode: '0755'
      when: not (miniconda_root is exists)

    - name: Install Miniconda (non-interactive)
      ansible.builtin.command: "/tmp/{{ miniconda_installer }} -b -u -p {{ miniconda_root }}"
      args:
        creates: "{{ miniconda_root }}/bin/conda"
      when: not (miniconda_root is exists)

    - name: Ensure Miniconda ownership
      ansible.builtin.file:
        path: "{{ miniconda_root }}"
        state: directory
        recurse: true
        owner: "{{ miniconda_owner }}"
        group: "{{ miniconda_owner }}"
      when: miniconda_owner | length > 0

    - name: Add conda init to profile
      ansible.builtin.copy:
        dest: /etc/profile.d/conda.sh
        mode: '0755'
        content: |
          #!/bin/sh
          if [ -f "{{ miniconda_root }}/etc/profile.d/conda.sh" ]; then
            . "{{ miniconda_root }}/etc/profile.d/conda.sh"
          fi

    - name: Create conda env for AI
      ansible.builtin.command: "{{ miniconda_root }}/bin/conda create -y -n {{ conda_env_name }} python={{ conda_env_python }}"
      args:
        creates: "{{ miniconda_root }}/envs/{{ conda_env_name }}"
      environment:
        PATH: "{{ miniconda_root }}/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Ensure AI root directory
      ansible.builtin.file:
        path: "{{ ai_root }}"
        state: directory
        mode: '0755'
        owner: "{{ ai_owner }}"
        group: "{{ ai_owner }}"

    - name: Create AI workspace directories
      ansible.builtin.file:
        path: "{{ ai_root }}/{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ ai_owner }}"
        group: "{{ ai_owner }}"
      loop: "{{ ai_dirs }}"

    - name: Ensure OrcaSlicer config directory exists
      ansible.builtin.file:
        path: "{{ orcaslicer_config_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ ai_owner }}"
        group: "{{ ai_owner }}"

    - name: Disable sleep/hibernate targets
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
        state: stopped
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target

    - name: Clone ComfyUI
      ansible.builtin.git:
        repo: "{{ comfyui_repo }}"
        dest: "{{ comfyui_dir }}"
        version: "master"
        update: true
        depth: 1

    - name: Ensure ComfyUI custom_nodes directory
      ansible.builtin.file:
        path: "{{ comfyui_dir }}/custom_nodes"
        state: directory
        mode: '0755'
        owner: "{{ ai_owner }}"
        group: "{{ ai_owner }}"

    - name: Install ComfyUI plugins (clone if missing, update if present)
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ comfyui_dir }}/{{ item.dest_subdir }}"
        version: "main"
        update: true
        depth: 1
      loop: "{{ comfyui_plugins }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure ComfyUI ownership
      ansible.builtin.file:
        path: "{{ comfyui_dir }}"
        state: directory
        recurse: true
        owner: "{{ ai_owner }}"
        group: "{{ ai_owner }}"

    - name: Install ComfyUI Python requirements
      ansible.builtin.pip:
        requirements: "{{ comfyui_dir }}/requirements.txt"
        chdir: "{{ comfyui_dir }}"
        executable: pip3

    - name: Install ComfyUI plugin Python requirements (gitpython for manager)
      ansible.builtin.pip:
        name:
          - gitpython
        executable: pip3

    - name: Ensure ComfyUI user directory ownership
      ansible.builtin.file:
        path: "{{ comfyui_dir }}"
        state: directory
        recurse: true
        owner: "{{ ai_owner }}"
        group: "{{ ai_owner }}"

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Wait for Docker socket to become available
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        state: present
        timeout: 30

    - name: Create Portainer data directory
      ansible.builtin.file:
        path: "{{ portainer_data_dir }}"
        state: directory
        mode: '0755'

    - name: Check if Portainer container exists
      ansible.builtin.command: docker container inspect {{ portainer_container_name }}
      register: portainer_check
      failed_when: false
      changed_when: false

    - name: Deploy Portainer (if missing)
      ansible.builtin.command: >
        docker run -d
        --name {{ portainer_container_name }}
        --restart=unless-stopped
        -p 9443:9443
        -p 8000:8000
        -v /var/run/docker.sock:/var/run/docker.sock
        -v {{ portainer_data_dir }}:/data
        {{ portainer_image }}
      when: portainer_check.rc != 0

    - name: Ensure Portainer is running
      ansible.builtin.command: docker start {{ portainer_container_name }}
      register: portainer_start
      changed_when: portainer_start.rc == 0
      failed_when: portainer_start.rc != 0 and portainer_check.rc != 0

    - name: Check if Portainer Agent container exists
      ansible.builtin.command: docker container inspect {{ portainer_agent_container_name }}
      register: portainer_agent_check
      failed_when: false
      changed_when: false

    - name: Deploy Portainer Agent (if missing)
      ansible.builtin.command: >
        docker run -d
        --name {{ portainer_agent_container_name }}
        --restart=unless-stopped
        -p 9001:9001
        -v /var/run/docker.sock:/var/run/docker.sock
        -v /var/lib/docker/volumes:/var/lib/docker/volumes
        {{ portainer_agent_image }}
      when: portainer_agent_check.rc != 0

    - name: Ensure Portainer Agent is running
      ansible.builtin.command: docker start {{ portainer_agent_container_name }}
      register: portainer_agent_start
      changed_when: portainer_agent_start.rc == 0
      failed_when: portainer_agent_start.rc != 0 and portainer_agent_check.rc != 0
