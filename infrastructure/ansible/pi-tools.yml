---
- name: Docker and Portainer for Raspberry Pi hosts
  hosts: raspberry_pi
  become: true
  gather_facts: true

  vars:
    base_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_user: "{{ ansible_user | default('pi') }}"
    portainer_image: "portainer/portainer-ce:latest"
    portainer_container_name: "portainer"
    portainer_data_dir: "/opt/portainer/data"
    docker_arch_map:
      aarch64: arm64
      armv7l: armhf
      armv6l: armhf
      x86_64: amd64
    docker_arch: "{{ docker_arch_map.get(ansible_facts['architecture'], 'arm64') }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      register: apt_update
      until: apt_update is succeeded
      retries: 3
      delay: 5

    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key (dearmored)
      ansible.builtin.command: >
        bash -c "curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg"
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set permissions on Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: Add Docker APT repository (Debian-based for Raspberry Pi)
      ansible.builtin.apt_repository:
        repo: >
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/debian
          {{ ansible_facts['lsb']['codename'] }} stable
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Add user to docker group for non-root usage
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      when: docker_user | length > 0

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Wait for Docker socket to become available
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        state: present
        timeout: 30

    - name: Create Portainer data directory
      ansible.builtin.file:
        path: "{{ portainer_data_dir }}"
        state: directory
        mode: '0755'

    - name: Check if Portainer container exists
      ansible.builtin.command: docker container inspect {{ portainer_container_name }}
      register: portainer_check
      failed_when: false
      changed_when: false

    - name: Deploy Portainer (if missing)
      ansible.builtin.command: >
        docker run -d
        --name {{ portainer_container_name }}
        --restart=unless-stopped
        -p 9443:9443
        -p 9000:9000
        -p 8000:8000
        -v /var/run/docker.sock:/var/run/docker.sock
        -v {{ portainer_data_dir }}:/data
        {{ portainer_image }}
      when: portainer_check.rc != 0

    - name: Ensure Portainer is running
      ansible.builtin.command: docker start {{ portainer_container_name }}
      register: portainer_start
      changed_when: portainer_start.rc == 0
      failed_when: portainer_start.rc != 0 and portainer_check.rc != 0
