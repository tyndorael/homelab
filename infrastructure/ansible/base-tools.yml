---
- name: Base tools for Proxmox guests
  hosts: nami
  become: true
  gather_facts: true

  vars:
    guest_packages:
      - qemu-guest-agent
      - vnstat

  tasks:
    - name: Ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: true
      register: apt_update
      until: apt_update is succeeded
      retries: 3
      delay: 5

    - name: Install guest packages
      ansible.builtin.apt:
        name: "{{ guest_packages }}"
        state: present

    - name: Enable and start qemu-guest-agent service
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true

    - name: Enable and start vnstat service
      ansible.builtin.service:
        name: vnstat
        state: started
        enabled: true
