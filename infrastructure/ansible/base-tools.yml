---
- name: Base tools for Proxmox guests
  hosts: nami
  become: true
  gather_facts: true

  vars:
    guest_packages:
      - qemu-guest-agent
      - vnstat
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_user: "{{ ansible_user | default('ubuntu') }}"

  tasks:
    - name: Install guest packages
      ansible.builtin.apt:
        name: "{{ guest_packages }}"
        state: present
        update_cache: yes

    - name: Ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: true
      register: apt_update
      until: apt_update is succeeded
      retries: 3
      delay: 5

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: >
          deb [arch=amd64] https://download.docker.com/linux/ubuntu
          {{ ansible_lsb.codename }} stable
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Add user to docker group for non-root usage
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      when: docker_user | length > 0

    - name: Enable and start qemu-guest-agent service
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true

    - name: Enable and start vnstat service
      ansible.builtin.service:
        name: vnstat
        state: started
        enabled: true

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Wait for Docker socket to become available
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        state: present
        timeout: 30
