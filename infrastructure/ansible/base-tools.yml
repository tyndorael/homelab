---
- name: Base tools for Proxmox guests
  hosts: proxmox_guests
  become: true
  gather_facts: true

  vars:
    guest_packages:
      - qemu-guest-agent
      - vnstat
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - nfs-common
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_user: "{{ ansible_user | default('ubuntu') }}"
    portainer_image: "portainer/portainer-ce:latest"
    portainer_container_name: "portainer"
    portainer_data_dir: "/opt/portainer/data"

  tasks:
    - name: Install guest packages
      ansible.builtin.apt:
        name: "{{ guest_packages }}"
        state: present
        update_cache: yes

    - name: Ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: true
      register: apt_update
      until: apt_update is succeeded
      retries: 3
      delay: 5

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64] https://download.docker.com/linux/ubuntu
          {{ ansible_facts['lsb']['codename'] }} stable
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Add user to docker group for non-root usage
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      when: docker_user | length > 0

    - name: Enable and start qemu-guest-agent service
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true

    - name: Enable and start vnstat service
      ansible.builtin.service:
        name: vnstat
        state: started
        enabled: true

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Wait for Docker socket to become available
      ansible.builtin.wait_for:
        path: /var/run/docker.sock
        state: present
        timeout: 30

    - name: Create Portainer data directory
      ansible.builtin.file:
        path: "{{ portainer_data_dir }}"
        state: directory
        mode: '0755'

    - name: Check if Portainer container exists
      ansible.builtin.command: docker container inspect {{ portainer_container_name }}
      register: portainer_check
      failed_when: false
      changed_when: false

    - name: Deploy Portainer (if missing)
      ansible.builtin.command: >
        docker run -d
        --name {{ portainer_container_name }}
        --restart=unless-stopped
        -p 9443:9443
        -p 8000:8000
        -v /var/run/docker.sock:/var/run/docker.sock
        -v {{ portainer_data_dir }}:/data
        {{ portainer_image }}
      when: portainer_check.rc != 0

    - name: Ensure Portainer is running
      ansible.builtin.command: docker start {{ portainer_container_name }}
      register: portainer_start
      changed_when: portainer_start.rc == 0
      failed_when: portainer_start.rc != 0 and portainer_check.rc != 0

    - name: Reboot the machine and wait for connectivity
      ansible.builtin.reboot:
        reboot_timeout: 600
