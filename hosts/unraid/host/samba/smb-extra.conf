# Unraid SMB extras: copy to /boot/config/smb-extra.conf, then `smbcontrol smbd reload-config`.
# Included inside [global] of /etc/samba/smb.conf. See hosts/unraid/README.md (SMB).

# Only NTLMv2 logins (Unraid's default still allows NTLMv1).
ntlm auth = ntlmv2-only

# macOS: faster Finder listings in big folders (skips per-file access checks),
# and tidier resource-fork handling.
readdir_attr:aapl_max_access = no
fruit:posix_rename = yes
fruit:delete_empty_adfiles = yes
fruit:wipe_intentionally_left_blank_rfork = yes
