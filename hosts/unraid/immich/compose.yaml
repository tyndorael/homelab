# Immich — photo/video backup (Google Photos replacement).
# Based on the official v3.3.3 docker-compose.yml + its rootless example: every container runs as
# nobody:users (99:100), so pre-create the bind-mount folders with that owner (see the Unraid README).
#   Originals:  ${UPLOAD_LOCATION} (array, parity-protected)  -> /data
#   SSD (./data, cache pool): Postgres, thumbnails (regenerable, keeps the timeline fast), ML model cache.
# GPU: the RTX 3050 (shared with Jellyfin) does NVENC transcoding and CUDA machine learning.
# Keep the service names: Immich finds its peers at database / redis / immich-machine-learning.
name: immich

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  user: "${PUID:-99}:${PGID:-100}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - NET_RAW
  networks:
    - immich
  logging: *logging

x-db-env: &db-env
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}

services:
  immich-server:
    <<: *common
    image: ghcr.io/immich-app/immich-server:v3.3.3
    container_name: immich_server
    environment:
      <<: *db-env
      TZ: ${TZ:-UTC}
      # In Immich: Administration -> Settings -> Video Transcoding -> Hardware Acceleration: NVENC.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    runtime: nvidia
    ports:
      - "2283:2283"
    volumes:
      - ${UPLOAD_LOCATION:?set UPLOAD_LOCATION in .env}:/data
      - ./data/thumbs:/data/thumbs
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false

  immich-machine-learning:
    <<: *common
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.3-cuda
    container_name: immich_machine_learning
    environment:
      TZ: ${TZ:-UTC}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    runtime: nvidia
    volumes:
      - ./data/model-cache:/cache
    healthcheck:
      disable: false

  redis:
    <<: *common
    # Tag + digest exactly as in Immich's release compose file.
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich_redis
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    <<: *common
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # Local SSD only: network shares are not supported for the database.
      - ./data/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false

networks:
  immich:
    name: immich
