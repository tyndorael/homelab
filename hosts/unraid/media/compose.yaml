# Media stack — Jellyfin + *arr + qBittorrent.
# App config lives in ./config/<app> (next to this file, on the cache pool).
# Media + downloads share ONE mount (${DATA_ROOT} -> /data) so hardlinks and atomic moves work:
#   ${DATA_ROOT}/torrents/{movies,tv}   ${DATA_ROOT}/media/{movies,tv}
name: media

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-lsio-env: &lsio-env
  TZ: ${TZ:-UTC}
  PUID: ${PUID:-99}
  PGID: ${PGID:-100}
  UMASK: ${UMASK:-002}

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - media
  logging: *logging

services:
  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:12.2ubu2604-ls54
    container_name: jellyfin
    environment:
      <<: *lsio-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL:-}
    ports:
      - "8096:8096"
    volumes:
      - ./config/jellyfin:/config
      - ${DATA_ROOT:?set DATA_ROOT in .env}/media:/data/media:ro
    # Intel/AMD iGPU hardware transcoding:
    # devices:
    #   - /dev/dri:/dev/dri
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls328
    container_name: sonarr
    environment: *lsio-env
    ports:
      - "8989:8989"
    volumes:
      - ./config/sonarr:/config
      - ${DATA_ROOT}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/ping"]
      interval: 1m
      timeout: 10s
      retries: 3

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls320
    container_name: radarr
    environment: *lsio-env
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr:/config
      - ${DATA_ROOT}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 1m
      timeout: 10s
      retries: 3

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163
    container_name: prowlarr
    environment: *lsio-env
    ports:
      - "9696:9696"
    volumes:
      - ./config/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/ping"]
      interval: 1m
      timeout: 10s
      retries: 3

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls480
    container_name: qbittorrent
    environment:
      <<: *lsio-env
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${TORRENTING_PORT:-6881}
    ports:
      - "8080:8080"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/udp"
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_ROOT}/torrents:/data/torrents

networks:
  media:
    name: media
