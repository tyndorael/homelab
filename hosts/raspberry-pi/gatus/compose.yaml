# Gatus — health checks + status page (status.<domain>). Checks are code in ./config/config.yaml.
# Storage is in memory: nothing is written to the SD card; history resets on restart (by design).
name: gatus

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gatus:
    image: twinproduction/gatus:v5.37.0
    container_name: gatus
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Referenced from config/config.yaml
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PI_IP: ${PI_IP:?set PI_IP in .env}
      PI_TAILSCALE_IP: ${PI_TAILSCALE_IP:?set PI_TAILSCALE_IP in .env}
      ROUTER_IP: ${ROUTER_IP:?set ROUTER_IP in .env}
      PROXY_GATEWAY: ${PROXY_GATEWAY:?set PROXY_GATEWAY in .env}
      MAC_IP: ${MAC_IP:?set MAC_IP in .env}
      UNRAID_IP: ${UNRAID_IP:?set UNRAID_IP in .env}
      HA_IP: ${HA_IP:?set HA_IP in .env}
    ports:
      - "${GATUS_BIND:-0.0.0.0}:8085:8080"   # drop/restrict once proxied by NPM
    volumes:
      - ./config:/config:ro
    networks:
      - proxy
    read_only: true
    security_opt:
      - no-new-privileges:true
    # The image is FROM scratch (no shell/wget), so there is no container healthcheck;
    # Glance and Homepage monitor it over HTTP instead.
    logging: *logging

networks:
  proxy:
    external: true
