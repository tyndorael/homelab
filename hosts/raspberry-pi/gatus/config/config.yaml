# https://github.com/TwiN/gatus#configuration
# Environment placeholders (DOMAIN, PI_IP, PI_TAILSCALE_IP, ROUTER_IP, PROXY_GATEWAY, MAC_IP) come from gatus/.env via compose.yaml.
# Alerting is not configured yet: add an `alerting:` block (Telegram, ntfy, Discord…) and
# `alerts:` per endpoint when you want notifications.

ui:
  title: Homelab status
  header: Homelab
  dashboard-heading: Homelab status
  dashboard-subheading: Raspberry Pi (cyrene), Unraid (herta) and Mac mini (silverwolf)
  default-sort-by: group

storage:
  type: memory   # no writes to the SD card; history resets on restart

# Shared check settings, reused with YAML anchors.
x-https: &https
  interval: 2m
  client:
    dns-resolver: "udp://${PI_IP}:53"   # resolve *.DOMAIN through AdGuard, like LAN clients do
    timeout: 10s
  conditions:
    - "[STATUS] == 200"
    - "[RESPONSE_TIME] < 2000"
    - "[CERTIFICATE_EXPIRATION] > 480h"   # NPM renews at 30 days; < 20 days left means renewal is failing

x-internal: &internal
  interval: 1m
  client:
    timeout: 5s

endpoints:
  # --- What users hit: DNS (AdGuard) -> NPM -> container, over HTTPS with the wildcard cert ---
  - name: Homepage
    group: 1. Web (via NPM)
    url: "https://home.${DOMAIN}/"
    <<: *https
  - name: Glance
    group: 1. Web (via NPM)
    url: "https://glance.${DOMAIN}/"
    <<: *https
  - name: Nginx Proxy Manager
    group: 1. Web (via NPM)
    url: "https://npm.${DOMAIN}/"
    <<: *https
  - name: Portainer
    group: 1. Web (via NPM)
    url: "https://portainer.${DOMAIN}/"
    <<: *https
  - name: AdGuard Home
    group: 1. Web (via NPM)
    url: "https://adguard.${DOMAIN}/"
    <<: *https
  - name: Dozzle
    group: 1. Web (via NPM)
    url: "https://logs.${DOMAIN}/"
    <<: *https
  - name: Gatus
    group: 1. Web (via NPM)
    url: "https://status.${DOMAIN}/"
    <<: *https
  - name: Cockpit
    group: 1. Web (via NPM)
    url: "https://cockpit.${DOMAIN}/"
    <<: *https
  - name: Termix
    group: 1. Web (via NPM)
    url: "https://termix.${DOMAIN}/"
    <<: *https
  - name: Unraid (herta)
    group: 1. Web (via NPM)
    url: "https://herta.${DOMAIN}/login"
    <<: *https
  - name: Open WebUI (AI)
    group: 1. Web (via NPM)
    url: "https://ai.${DOMAIN}/health"
    <<: *https

  # --- Containers directly over the proxy network (tells NPM problems apart from app problems) ---
  - name: homepage
    group: 2. Containers
    url: "http://homepage:3000/api/healthcheck"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: glance
    group: 2. Containers
    url: "http://glance:8080/api/healthz"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: nginx-proxy-manager
    group: 2. Containers
    url: "http://nginx-proxy-manager:81/"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: portainer
    group: 2. Containers
    url: "http://portainer:9000/api/system/status"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: adguard-home
    group: 2. Containers
    url: "http://adguard-home:80/login.html"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: dozzle
    group: 2. Containers
    url: "http://dozzle:8080/healthcheck"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: termix
    group: 2. Containers
    url: "http://termix:8080/"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: cockpit (host, via proxy gateway)
    group: 2. Containers
    url: "https://${PROXY_GATEWAY}:9090/"
    interval: 1m
    client:
      timeout: 5s
      insecure: true   # Cockpit's own self-signed cert; the public one is checked via NPM above
    conditions: ["[STATUS] == 200"]

  # --- DNS ---
  - name: Local records (*.DOMAIN -> Pi)
    group: 3. DNS (AdGuard)
    url: "${PI_IP}"
    interval: 1m
    dns:
      query-name: "home.${DOMAIN}"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == ${PI_IP}"
  - name: Ad blocking
    group: 3. DNS (AdGuard)
    url: "${PI_IP}"
    interval: 5m
    dns:
      query-name: "doubleclick.net"
      query-type: "A"
    conditions:
      - "[BODY] == 0.0.0.0"
  - name: Upstream resolution
    group: 3. DNS (AdGuard)
    url: "${PI_IP}"
    interval: 1m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"

  # --- Network ---
  - name: Router DNS
    group: 4. Network
    url: "${ROUTER_IP}"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
  - name: Internet (Cloudflare DNS)
    group: 4. Network
    url: "1.1.1.1"
    interval: 2m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
  - name: Tailscale (Pi reachable on tailnet IP)
    group: 4. Network
    url: "tcp://${PI_TAILSCALE_IP}:22"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"

  - name: Unraid web UI
    group: 5. Hosts
    url: "http://${UNRAID_IP}/"
    interval: 1m
    client:
      timeout: 5s
      ignore-redirect: true   # / answers 302 -> /Main or /login
    conditions: ["[STATUS] < 400"]
  - name: Unraid SSH
    group: 5. Hosts
    url: "tcp://${UNRAID_IP}:22"
    interval: 2m
    conditions: ["[CONNECTED] == true"]
  - name: Unraid Portainer agent
    group: 5. Hosts
    url: "https://${UNRAID_IP}:9001/ping"
    interval: 1m
    client:
      timeout: 5s
      insecure: true   # the agent's self-signed TLS cert
    conditions: ["[STATUS] == 204"]
  - name: Unraid Dozzle agent
    group: 5. Hosts
    url: "tcp://${UNRAID_IP}:7007"
    interval: 2m
    conditions: ["[CONNECTED] == true"]

  # --- Media stack on Unraid (direct, LAN) ---
  - name: Jellyfin
    group: 7. Media (herta)
    url: "http://${UNRAID_IP}:8096/health"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: Sonarr
    group: 7. Media (herta)
    url: "http://${UNRAID_IP}:8989/ping"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: Radarr
    group: 7. Media (herta)
    url: "http://${UNRAID_IP}:7878/ping"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: Prowlarr
    group: 7. Media (herta)
    url: "http://${UNRAID_IP}:9696/ping"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: qBittorrent
    group: 7. Media (herta)
    url: "http://${UNRAID_IP}:8080/"
    <<: *internal
    conditions: ["[STATUS] == 200"]
  - name: Mac mini Portainer agent
    group: 5. Hosts
    url: "https://${MAC_IP}:9001/ping"
    interval: 1m
    client:
      timeout: 5s
      insecure: true   # the agent's self-signed TLS cert
    conditions: ["[STATUS] == 204"]
  - name: Mac mini SSH
    group: 5. Hosts
    url: "tcp://${MAC_IP}:22"
    interval: 2m
    conditions: ["[CONNECTED] == true"]
  - name: Mac mini Screen Sharing (VNC)
    group: 5. Hosts
    url: "tcp://${MAC_IP}:5900"
    interval: 2m
    conditions: ["[CONNECTED] == true"]
  - name: Mac mini Dozzle agent
    group: 5. Hosts
    url: "tcp://${MAC_IP}:7007"
    interval: 2m
    conditions: ["[CONNECTED] == true"]
  - name: Mac mini Open WebUI (direct)
    group: 5. Hosts
    url: "http://${MAC_IP}:8088/health"
    interval: 1m
    client:
      timeout: 5s
    conditions: ["[STATUS] == 200"]

  # --- Remote desktop ---
  - name: RustDesk ID server (hbbs)
    group: 6. Remote desktop
    url: "tcp://${PI_IP}:21116"
    interval: 2m
    conditions: ["[CONNECTED] == true"]
  - name: RustDesk relay (hbbr)
    group: 6. Remote desktop
    url: "tcp://${PI_IP}:21117"
    interval: 2m
    conditions: ["[CONNECTED] == true"]
