# RustDesk server (self-hosted ID/rendezvous + relay) — remote desktop for the Mac mini and other
# machines without any third-party servers. Clients on the LAN or the tailnet point at the Pi.
# Host networking (as recommended upstream) so hbbs sees real client IPs for direct P2P connections.
# ./data holds the server key pair (id_ed25519[.pub]) — clients pin the public key; back it up.
# Ports: 21115-21117/tcp, 21116/udp (+ 21118/21119 web client, unused). LAN/tailnet only, never forwarded.
name: rustdesk

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  image: rustdesk/rustdesk-server:1.1.16
  restart: unless-stopped
  network_mode: host
  volumes:
    - ./data:/root
  environment:
    TZ: ${TZ:-UTC}
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  hbbs:   # ID / rendezvous server
    <<: *common
    container_name: rustdesk-hbbs
    command: hbbs -r ${RELAY_HOST:?set RELAY_HOST in .env}:21117 -k _   # -k _ = only clients with our key
    depends_on:
      - hbbr

  hbbr:   # relay server
    <<: *common
    container_name: rustdesk-hbbr
    command: hbbr -k _
