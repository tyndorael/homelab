# https://github.com/glanceapp/glance/blob/main/docs/configuration.md
# Environment placeholders (DOMAIN, WEATHER_LOCATION) come from glance/.env via compose.yaml. Saving this file reloads Glance.
server:
  port: 8080

pages:
  - name: Home
    hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: calendar
            first-day-of-week: monday

          - type: weather
            location: ${WEATHER_LOCATION}
            units: metric
            hour-format: 24h

          - type: releases
            title: Homelab releases
            cache: 12h
            show-source-icon: true
            collapse-after: 6
            repositories:
              - NginxProxyManager/nginx-proxy-manager
              - portainer/portainer
              - gethomepage/homepage
              - glanceapp/glance
              - AdguardTeam/AdGuardHome
              - tailscale/tailscale
              - jellyfin/jellyfin

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            autofocus: true

          # Reddit's JSON API (used by the `reddit` widget) answers 403 without an app key, so the
          # subreddits come in through their public RSS feeds instead. Reddit also rejects Go's default
          # User-Agent, hence the header; the 1h cache keeps us well under its rate limit.
          - type: group
            widgets:
              - type: rss
                title: r/selfhosted
                style: detailed-list
                cache: 1h
                limit: 15
                collapse-after: 6
                feeds:
                  - url: https://www.reddit.com/r/selfhosted/.rss
                    headers:
                      User-Agent: Mozilla/5.0 (X11; Linux aarch64) Glance/0.8.6
              - type: rss
                title: r/homelab
                style: detailed-list
                cache: 1h
                limit: 15
                collapse-after: 6
                feeds:
                  - url: https://www.reddit.com/r/homelab/.rss
                    headers:
                      User-Agent: Mozilla/5.0 (X11; Linux aarch64) Glance/0.8.6
              - type: hacker-news

          - type: rss
            title: Self-hosting news
            style: horizontal-cards
            cache: 12h
            limit: 12
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st

      - size: small
        widgets:
          - type: monitor
            title: Services
            cache: 1m
            sites:
              - title: Homepage
                url: https://home.${DOMAIN}
                check-url: http://homepage:3000/api/healthcheck
                icon: di:homepage
              - title: Nginx Proxy Manager
                url: https://npm.${DOMAIN}
                check-url: http://nginx-proxy-manager:81
                icon: di:nginx-proxy-manager
              - title: Portainer
                url: https://portainer.${DOMAIN}
                check-url: http://portainer:9000/api/system/status
                icon: di:portainer
              - title: AdGuard Home
                url: https://adguard.${DOMAIN}
                check-url: http://adguard-home:80/login.html
                icon: di:adguard-home

          - type: bookmarks
            groups:
              - title: Admin
                links:
                  - title: Tailscale console
                    url: https://login.tailscale.com/admin/machines
                  - title: DuckDNS
                    url: https://www.duckdns.org/
                  - title: Homelab repo
                    url: https://github.com/tyndorael/homelab
