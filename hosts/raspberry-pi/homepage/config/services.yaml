# https://gethomepage.dev/configs/services/
# {{HOMEPAGE_VAR_*}} values come from homepage/.env (see compose.yaml).
# Widget credentials live in .env and are passed through compose.yaml as HOMEPAGE_VAR_*.
# Widgets reach Pi services by container name over the `proxy` network.

- Infrastructure:
    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: https://npm.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse proxy & certificates
        server: pi
        container: nginx-proxy-manager
        widget:
          type: npm
          url: http://nginx-proxy-manager:81
          username: "{{HOMEPAGE_VAR_NPM_USERNAME}}"
          password: "{{HOMEPAGE_VAR_NPM_PASSWORD}}"
    - Portainer:
        icon: portainer.png
        href: https://portainer.{{HOMEPAGE_VAR_DOMAIN}}
        description: Docker management (Pi, Unraid, Mac mini)
        server: pi
        container: portainer
        widget:
          type: portainer
          url: http://portainer:9000
          env: "{{HOMEPAGE_VAR_PORTAINER_ENV}}"
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"
    - AdGuard Home:
        icon: adguard-home.png
        href: https://adguard.{{HOMEPAGE_VAR_DOMAIN}}
        description: DNS & ad blocking
        server: pi
        container: adguard-home
        widget:
          type: adguard
          url: http://adguard-home:80
          username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Glance:
        icon: glance.png
        href: https://glance.{{HOMEPAGE_VAR_DOMAIN}}
        description: Start page — feeds, weather, releases
        server: pi
        container: glance
    - Gatus:
        icon: gatus.png
        href: https://status.{{HOMEPAGE_VAR_DOMAIN}}
        description: Health checks & status page
        server: pi
        container: gatus
        widget:
          type: gatus
          url: http://gatus:8080
    - Dozzle:
        icon: dozzle.png
        href: https://logs.{{HOMEPAGE_VAR_DOMAIN}}
        description: Container logs
        server: pi
        container: dozzle
    - Cockpit:
        icon: cockpit.png
        href: https://cockpit.{{HOMEPAGE_VAR_DOMAIN}}
        description: Pi host admin (services, storage, network, updates)
        siteMonitor: https://cockpit.{{HOMEPAGE_VAR_DOMAIN}}
    - Termix:
        icon: termix.png
        href: https://termix.{{HOMEPAGE_VAR_DOMAIN}}
        description: Browser SSH to all hosts
        server: pi
        container: termix
    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: Remote access (subnet router)
        server: pi
        container: tailscale
    - Unraid:
        icon: unraid.png
        href: http://{{HOMEPAGE_VAR_UNRAID_IP}}
        description: NAS
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:8096
    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:8989
    - Radarr:
        icon: radarr.png
        href: https://radarr.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:7878
    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:9696
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbittorrent.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:8080

- Development:
    - Mac mini:
        icon: mdi-apple
        description: Dev box (Docker)
        siteMonitor: http://{{HOMEPAGE_VAR_MAC_IP}}:9001
