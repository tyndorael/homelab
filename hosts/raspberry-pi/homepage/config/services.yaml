# https://gethomepage.dev/configs/services/
# {{HOMEPAGE_VAR_*}} values come from homepage/.env (see compose.yaml).
# Add API-key widgets later; keep keys in .env as HOMEPAGE_VAR_* and pass them through compose.yaml.

- Infrastructure:
    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: https://npm.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse proxy & certificates
        server: pi
        container: nginx-proxy-manager
    - Portainer:
        icon: portainer.png
        href: https://portainer.{{HOMEPAGE_VAR_DOMAIN}}
        description: Docker management (Pi, Unraid, Mac mini)
        server: pi
        container: portainer
    - Unraid:
        icon: unraid.png
        href: http://{{HOMEPAGE_VAR_UNRAID_IP}}
        description: NAS
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:8096
    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:8989
    - Radarr:
        icon: radarr.png
        href: https://radarr.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:7878
    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:9696
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbittorrent.{{HOMEPAGE_VAR_DOMAIN}}
        siteMonitor: http://{{HOMEPAGE_VAR_UNRAID_IP}}:8080

- Development:
    - Mac mini:
        icon: mdi-apple
        description: Dev box (Docker)
        siteMonitor: http://{{HOMEPAGE_VAR_MAC_IP}}:9001
