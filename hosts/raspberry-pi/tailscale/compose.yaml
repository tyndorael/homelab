# Tailscale — remote access to the whole LAN without opening ports (subnet router).
# Without TS_AUTHKEY the first start prints a login URL: `make logs HOST=raspberry-pi STACK=tailscale`.
# Then approve the advertised route in the Tailscale admin console (Machines -> cyrene -> Edit route settings).
name: tailscale

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tailscale:
    image: tailscale/tailscale:v1.104.1
    container_name: tailscale
    restart: unless-stopped
    network_mode: host   # kernel networking: routes LAN traffic and reaches every host port
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-UTC}
      TS_AUTHKEY: ${TS_AUTHKEY:-}            # optional; leave empty to log in via URL
      TS_HOSTNAME: ${TS_HOSTNAME:-cyrene}
      TS_STATE_DIR: /var/lib/tailscale        # node identity survives recreation
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"                  # the Pi keeps its own resolver
      TS_ROUTES: ${TS_ROUTES:-192.168.50.0/24}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - ./data:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
